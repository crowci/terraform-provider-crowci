# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - "v*"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Install git-sv
        env:
          # renovate: datasource=github-releases depName=thegeeklab/git-sv
          GIT_SV_VERSION: "2.1.3"
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "${HOME}/.local/bin"
          curl -sfLo "${HOME}/.local/bin/git-sv" \
            "https://github.com/thegeeklab/git-sv/releases/download/v${GIT_SV_VERSION}/git-sv-linux-${arch}"
          chmod +x "${HOME}/.local/bin/git-sv"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Generate release notes
        # Written outside the work tree: goreleaser refuses to release from a
        # dirty git state. This is why the goreleaser changelog stays disabled.
        run: |
          git-sv release-notes -t "${GITHUB_REF_NAME}" -o "${RUNNER_TEMP}/release-notes.md"
          # Drop the "## v1.2.3 (date)" heading and its blank line; the release
          # title already carries the version.
          sed -i '1,2d' "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
