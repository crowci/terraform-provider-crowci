# Keeps a single "Changelog for upcoming version" issue in sync with the
# conventional commits made since the last tag, so the notes of the next
# release can be reviewed before tagging.
name: Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: upcoming changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-sv derives the upcoming version from every commit since the
          # last tag, so it needs the full history and all tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Install git-sv
        env:
          # renovate: datasource=github-releases depName=thegeeklab/git-sv
          GIT_SV_VERSION: "2.1.3"
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "${HOME}/.local/bin"
          curl -sfLo "${HOME}/.local/bin/git-sv" \
            "https://github.com/thegeeklab/git-sv/releases/download/v${GIT_SV_VERSION}/git-sv-linux-${arch}"
          chmod +x "${HOME}/.local/bin/git-sv"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Create or update the changelog issue
        env:
          # Token of the bot account that owns the changelog issue; the
          # automatic Actions token cannot write issues.
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
          ISSUE_TITLE: Changelog for upcoming version
        run: |
          set -euo pipefail

          # Notes for the unreleased commits, headed by the version they bump to.
          git-sv release-notes -o "${RUNNER_TEMP}/changelog.md"
          cat "${RUNNER_TEMP}/changelog.md"

          API_BASE="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # `type=issues` keeps pull requests, which the same endpoint serves,
          # out of the lookup.
          ISSUE_NUMBER=$(curl -sf -G "${API_BASE}/issues" \
            -H "Authorization: token ${ISSUE_TOKEN}" \
            --data-urlencode "state=open" \
            --data-urlencode "type=issues" \
            --data-urlencode "q=${ISSUE_TITLE}" \
            | jq -r --arg title "${ISSUE_TITLE}" \
              '[.[] | select(.title == $title)] | first | .number // empty')

          JSON_DATA=$(jq -n --arg title "${ISSUE_TITLE}" \
            --arg body "$(cat "${RUNNER_TEMP}/changelog.md")" \
            '{title: $title, body: $body}')

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "Creating changelog issue..."
            curl -sf -X POST "${API_BASE}/issues" \
              -H "Authorization: token ${ISSUE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${JSON_DATA}" > /dev/null
          else
            echo "Updating changelog issue #${ISSUE_NUMBER}..."
            curl -sf -X PATCH "${API_BASE}/issues/${ISSUE_NUMBER}" \
              -H "Authorization: token ${ISSUE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${JSON_DATA}" > /dev/null
          fi
